{{-  if .Values.global.copyHelperEnabled }}
apiVersion: v1
kind: Pod
metadata:
  name: pvc-copy-helper
spec:
  restartPolicy: Never
  containers:
    - name: copy
      image: busybox:1.36
      command: ["sleep", "3600"]
      volumeMounts:
        - name: target
          mountPath: /target
  volumes:
    - name: target
      persistentVolumeClaim:
        claimName: {{ printf "%s-post-data" (include "tolerant-post.fullname" .) }}
{{- end }}