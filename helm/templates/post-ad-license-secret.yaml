{{- $isV6 := include "tolerant-post.isV6Engine" . -}}
{{- if or (not $isV6) .Values.global.post.v6LicenceFileName }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tolerant-post.fullname" . }}-post-ad-license
type: Opaque
data:
{{- if $isV6}}
{{ printf "%s: |" .Values.global.post.v6LicenceFileName | indent 2 }}
{{ .Files.Get (printf "files/v6/%s" .Values.global.post.v6LicenceFileName) | b64enc | indent 4 }}
{{- else }}
{{- range .Values.global.post.v5Licenses }}
{{ .envName | indent 2 }}: {{ (.value | default "" | toString) | b64enc | quote }}
{{- end }}
{{- end }}
{{- end }}
