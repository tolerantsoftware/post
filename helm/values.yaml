replicaCount: 1

image:
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

# This section configures the Gateway API, more information can be found here: https://docs.nginx.com/nginx-gateway-fabric/install/manifests/open-source/
gateway:
  existing:
    enabled: false
    # Set these to reference a Gateway managed outside this release.
    gatewayName: ""
    gatewayNamespace: ""
  enabled: true
  clientMaxBodySize: "101m"
  className: nginx
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      hostname: post.tolerant-software.de
    # HTTPS example. Replace the hostname and Secret name before enabling this listener. https://gateway-api.sigs.k8s.io/guides/user-guides/tls/
    # - name: https
    #   protocol: HTTPS
    #   port: 443
    #   hostname: post.tolerant-software.de
    #   tls:
    #     mode: Terminate
    #     certificateRefs:
    #       - name: tolerant-post-tls
    #         kind: Secret
  paths:
    - path: /
      pathType: PathPrefix
  backend:
    # Optional explicit backend paths for http route routing.
    # When set, these paths are used instead of paths.
    # Useful when GUI is served under /ui and backend endpoints must stay at root paths (e.g. /api).
    paths: [ ]
    pathType: PathPrefix
  gui:
    enabled: true
    redirectToTrailingSlash: true
    paths:
      - path: /ui
        pathType: PathPrefix

podAnnotations: {}
podLabels: {}

global:
  copyHelperEnabled: false
  post:
    engineVersion: V6
    license: ""
    v5Licenses:
      - envName: UNLOCKCODE
        value: ""
    v6LicenceFileName: ""


imagePullSecrets: []
podSecurityContext: {}
securityContext: {}

volumes: []
volumeMounts: []

persistence:
  keepPVCOnUninstall: true
  data:
    enabled: true
    existingClaim: ""
    accessMode: ReadWriteMany
    size: 10Gi
    storageClassName: ""
    mountPath: /opt/tolerant/data
  configFiles:
    # Declarative mode only:
    # Mount a PVC as /opt/tolerant/config to provide full customer-managed config files.
    # Must remain false in runtime mode.
    enabled: true
    existingClaim: ""
    accessMode: ReadWriteOnce
    size: 1Gi
    storageClassName: ""
  runtimeConfig:
    # Runtime mode only:
    # Writable config PVC mounted at /opt/tolerant/config (GUI/API edits persist here).
    # Ignored unless config.managementMode=runtime.
    existingClaim: ""
    accessMode: ReadWriteOnce
    size: 5Gi
    storageClassName: ""
    seedFromConfigMaps:
      # When enabled in runtime mode, copy default config files from chart ConfigMaps
      # into runtime PVC if files are missing (non-destructive seeding).
      enabled: true
      image: busybox:1.36

containers:
  post:
    image: tolerantsoftware/post:12.2
    threadCount: "4"
    loggingProfile: console
    resources: {}
    livenessProbe:
      httpGet:
        path: /health/liveness
        port: http
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 6
    readinessProbe:
      httpGet:
        path: /health/readiness
        port: http
      initialDelaySeconds: 10
      periodSeconds: 5
      timeoutSeconds: 5
      failureThreshold: 6
    startupProbe:
      httpGet:
        path: /health/readiness
        port: http
      initialDelaySeconds: 10
      periodSeconds: 5
      timeoutSeconds: 5
      failureThreshold: 24
  gui:
    image: tolerantsoftware/post-gui:12.2
    imagePullPolicy: IfNotPresent
    port: 8081
    basePath: /ui
    apiBasePath: /
    env: [ ]
    resources: { }
    securityContext: { }
    volumeMounts: [ ]


config:
  # Config ownership mode:
  # - declarative: Helm/ConfigMap managed config (default)
  # - runtime: writable PVC managed at runtime (GUI/API edits)
  managementMode: declarative

master:
  enabled: true
  # GUI_ENABLED for backend on master pod.
  guiEnabled: true
  updateStrategy:
    type: Recreate
  gui:
    enabled: true

metrics:
  enabled: false
  path: /prometheus
  port: "8080"
  scheme: http
  service:
    annotations: {}
  serviceMonitor:
    enabled: false
    namespace: ""
    labels: {}
    interval: 30s
    scrapeTimeout: 10s

telemetry:
  tracing:
    enabled: false
    endpoint: ""
    protocol: http/protobuf
    sampler: parentbased_traceidratio
    samplerArgument: "0.05"
  logs:
    enabled: false
    endpoint: ""
    protocol: http/protobuf
    level: info

security:
  enabled: false
  oidc:
    identityProviderUrl: ""
    realm: ""
    clientId: ""
