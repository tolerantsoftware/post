suite: post data pvc
templates:
  - templates/post-data-pvc.yaml
tests:
  - it: renders data pvc by default
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: PersistentVolumeClaim
      - equal:
          path: metadata.name
          value: RELEASE-NAME-tolerant-post-post-data

  - it: dos not render data pvc data mode with existingClaim
    set:
      persistence.data.enabled: true
      persistence.data.existingClaim: "test-claim"
    asserts:
      - hasDocuments:
          count: 0
