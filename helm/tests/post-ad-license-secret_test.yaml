suite: post address verification license secret
templates:
  - templates/post-ad-license-secret.yaml
tests:
  - it: does not render malformed V6 secret when license filename is missing
    set:
      global.post.engineVersion: V6
      global.post.v6LicenceFileName: ""
    asserts:
      - hasDocuments:
          count: 0

  - it: renders V5 unlock codes
    set:
      global.post.engineVersion: V5
      global.post.v5Licenses:
        - envName: UNLOCKCODE
          value: test-license
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: data.UNLOCKCODE
          value: dGVzdC1saWNlbnNl
